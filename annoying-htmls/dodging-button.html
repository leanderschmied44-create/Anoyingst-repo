<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dodging Button</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; background: radial-gradient(circle, #ffe4e6, #fecdd3, #fb7185); overflow: hidden; }
    a { position: fixed; top: 1rem; left: 1rem; color: #111827; background: #fff; padding: 0.6rem 0.8rem; border-radius: 999px; font-weight: 800; z-index: 3; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 5rem 1rem 1rem; text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 5rem); }
    #runner { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); padding: 1rem 1.4rem; border: 4px solid #111827; border-radius: 1rem; background: #facc15; font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: left 130ms ease, top 130ms ease, transform 130ms ease; }
    #runner.resting { background: #86efac; }
    #status { font-weight: 800; min-height: 1.5rem; }
  </style>
</head>
<body>
  <a href="index.html">← Leave button alone</a>
  <main>
    <div>
      <h1>Can you click it?</h1>
      <p id="status" aria-live="polite">The button has trust issues.</p>
    </div>
    <button id="runner" type="button">Click me, coward</button>
  </main>
  <script>
    const button = document.querySelector('#runner');
    const status = document.querySelector('#status');
    let clickableUntil = 0;

    function moveButton() {
      const pad = 24;
      const maxX = window.innerWidth - button.offsetWidth - pad;
      const maxY = window.innerHeight - button.offsetHeight - pad;
      button.style.left = `${Math.max(pad, Math.random() * maxX)}px`;
      button.style.top = `${Math.max(80, Math.random() * maxY)}px`;
      button.classList.remove('resting');
    }

    document.addEventListener('pointermove', event => {
      const box = button.getBoundingClientRect();
      const close = event.clientX > box.left - 90 && event.clientX < box.right + 90 && event.clientY > box.top - 90 && event.clientY < box.bottom + 90;
      const lucky = Math.random() < 0.015;
      if (close && !lucky) moveButton();
      if (close && lucky) {
        clickableUntil = Date.now() + 1000;
        button.classList.add('resting');
        status.textContent = 'Tiny clickable window opened. Be gentle.';
      }
    });

    button.addEventListener('click', () => {
      status.textContent = Date.now() < clickableUntil ? 'Impossible! You clicked the slippery rectangle.' : 'Nice try. The button filed a motion to relocate.';
      moveButton();
    });
  </script>
</body>
</html>
